name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npx --yes @vscode/vsce@3.2.1 package -o tex-bionic-morandi.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: tex-bionic-morandi.vsix

  # Publishes when a tag such as v1.0.1 is pushed.
  # Needs repository secrets VSCE_PAT (VS Code Marketplace) and, optionally, OVSX_PAT (Open VSX).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3.2.1 publish -p "$VSCE_PAT"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10.1 publish -p "$OVSX_PAT"
